<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1021"><title>知識 Wiki | RAG ATLAS</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="topbar"><a class="logo" href="index.html"><span class="logo-symbol">◈</span> RAG ATLAS <span style="color:var(--soft);font-weight:500;font-size:11px">LLM WIKI PROJECT</span></a><nav class="navlinks"><a href="index.html" class="">首頁</a><a href="wiki.html" class="active">知識 Wiki</a><a href="slides.html" class="">教學簡報</a><a href="workflow.html" class="">工作流程</a></nav></header><main class="page-container"><div class="wiki-wrap"><aside class="wiki-side"><div class="eyebrow">SEARCH THE WIKI</div><h3>知識索引</h3><input id="wiki-search" class="search" placeholder="搜尋：檢索、向量、評估…" aria-label="搜尋 Wiki 知識頁"><div class="wiki-menu" id="wiki-menu"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><a class="btn secondary" href="#sources" id="all-sources-jump" style="display:block;text-align:center">檢視 6 份來源 ↗</a><div class="stats-inline" style="margin-top:18px"><span>9 篇概念頁</span><span>6 份資料</span></div></aside><article class="wiki-content glass" id="wiki-content" aria-live="polite"></article></div><section class="section" id="sources"><div class="eyebrow">SOURCE LEDGER</div><h2 class="section-title">已 ingest 的資料</h2><p class="section-intro">每份皆保留來源頁面連結與自撰摘要，可在專案 <code>sources/Sxx.md</code> 查閱。來源摘要不是原文全文。</p><div class="all-sources glass" id="source-ledger"></div></section></main><footer class="footer"><div class="page-container footer-inner"><span>RAG ATLAS · LLM-assisted, source-traceable educational wiki</span><span>2026.11.22｜提供離線閱讀 · 引用請回原始來源查核</span></div></footer><script id="data-pages" type="application/json">[{"id": "intro", "title": "RAG 是什麼？", "topic": "核心概念", "lead": "檢索增強生成（Retrieval-Augmented Generation）把「先找資料」和「再由 LLM 回答」結合。", "bullets": ["一般 LLM 可能不知道尚未納入訓練的新資訊與私有文件。", "RAG 把外部資料作為回答當下的參考，讓回答更有依據。", "它改善的是「取得與使用知識」的流程，不等於把新資料重新訓練進模型。"], "example": "例如學生問「這學期實驗室借用規定？」：系統先找到公告，再用公告回答。", "sources": ["S01", "S02", "S03"], "related": ["retrieve", "prompt", "limits"]}, {"id": "prepare", "title": "建立知識庫：資料、切塊與索引", "topic": "核心流程", "lead": "使用者發問以前，先讓文件變得容易被搜尋。", "bullets": ["蒐集可靠的 PDF、公告、網頁或規章，保留標題與來源。", "將長篇文件依語意或段落切成較小的 chunk。", "可建立關鍵字索引或產生 Embedding 向量並寫入向量索引。"], "example": "30 頁的借用手冊，不必每次整本塞進提示詞；可以先切成「借用時間」「設備注意事項」等段落。", "sources": ["S02", "S04"], "related": ["retrieve", "embedding", "intro"]}, {"id": "embedding", "title": "Embedding 與向量檢索", "topic": "重要術語", "lead": "Embedding 將文字映射為數值向量，便於比較語意相似性。", "bullets": ["「教室能借到幾點？」與「空間開放時間」的字詞不同，但語意可能相近。", "向量檢索在語意接近的情況下有幫助；精確編號或專有名詞也常需關鍵字檢索。", "混合檢索可同時利用關鍵字與向量訊號。"], "example": "問「申請門禁」也可能檢索到標題寫「實驗室出入權限」的段落。", "sources": ["S04"], "related": ["prepare", "retrieve"]}, {"id": "retrieve", "title": "Retrieve：先找到證據", "topic": "核心流程", "lead": "問題進來後，檢索器從索引找出可能回答問題的相關片段。", "bullets": ["根據問題進行關鍵字、向量或混合檢索。", "選取少量相關段落（例如 top-k）；必要時重新排序。", "若檢索不到足夠資料，應先回報不足，而不是憑空補完。"], "example": "「實驗室週日能進去嗎？」→ 找到「開放時間與權限」規定的片段。", "sources": ["S04", "S06"], "related": ["embedding", "prompt", "limits"]}, {"id": "prompt", "title": "Augment + Generate：根據資料回答", "topic": "核心流程", "lead": "把問題、取回的片段與回答規則放進提示詞，再請 LLM 作答。", "bullets": ["Augment：把檢索到的依據放到模型可見的上下文。", "Generate：要求模型依據上下文整理答案，並標示來源。", "若來源沒有說明，就明確告知「目前資料不足」。"], "example": "規定片段寫「週日不開放」→ 回答「依據場地管理公告，週日不開放」，並附公告名稱。", "sources": ["S01", "S03", "S04"], "related": ["retrieve", "evaluation", "limits"]}, {"id": "compare", "title": "RAG、一般聊天與微調的差別", "topic": "概念比較", "lead": "三者可互補，但處理問題的機制不同。", "bullets": ["一般聊天：主要依賴對話上下文與模型既有能力，不會自動知道校內新公告。", "RAG：在回答時查外部文件，適合資料經常更新、需要追溯來源的場景。", "微調：透過額外訓練影響模型行為或領域表現，通常不是用來頻繁同步每篇公告的首選。"], "example": "校務 FAQ 更新頻繁，優先考慮更新知識庫；若要固定輸出格式，可另外評估提示設計或微調。", "sources": ["S01", "S02", "S03"], "related": ["intro", "prepare"]}, {"id": "limits", "title": "RAG 仍然可能答錯", "topic": "品質控制", "lead": "檢索增加可用資訊，但不是保證正確的開關。", "bullets": ["資料本身過期或相互矛盾：答案可能跟著錯。", "切塊不當或檢索失敗：模型看不到關鍵證據。", "即使有證據，模型仍可能誤解、擴大推論或漏掉限制條件。"], "example": "找到去年規定卻回答今年的開放時間，就是「資料版本檢查」沒做好。", "sources": ["S03", "S04"], "related": ["prepare", "retrieve", "evaluation"]}, {"id": "evaluation", "title": "如何檢查 RAG 的品質", "topic": "品質控制", "lead": "要分開檢查「找得對不對」與「答得有沒有根據」。", "bullets": ["來源完整性：標題、網址、日期或版本是否保留。", "檢索相關性：取回片段能否回答問題。", "忠實度 Faithfulness：答案中的主張是否能從檢索內容推得。", "可用性：初學者看得懂嗎？引用能否點回原始文件？"], "example": "答案：「週日可借用」但證據只寫「平日 9–17 時」→ 不能從證據推得，判為不忠實。", "sources": ["S04", "S05", "S06"], "related": ["prompt", "limits"]}, {"id": "applications", "title": "日常實際應用：校園知識助理", "topic": "實作情境", "lead": "以課務公告、實驗室規章或報帳文件建立可查詢的校園助手。", "bullets": ["輸入：校內可信公告、規範文件，並記錄更新時間。", "查詢：學生用自然語言提問；系統找對應段落。", "回答：整理重點並附文件來源；資料不足時提示詢問承辦人。", "維護：新規定進來就更新知識庫並回歸測試。"], "example": "不再對著 20 份 PDF 猜「核銷屬於材料費還是雜支」；以現行核銷要點為準。", "sources": ["S02", "S03", "S04", "S06"], "related": ["intro", "prepare", "evaluation"]}]</script><script id="data-sources" type="application/json">[{"id": "S01", "publisher": "NeurIPS 2020 / Lewis et al.", "title": "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", "url": "https://proceedings.neurips.cc/paper/2020/hash/6b493230205f780e1bc26945df7481e5-Abstract.html", "type": "研究論文", "date": "2020", "takeaways": ["RAG 讓語言生成結合模型內部知識與外部可檢索的知識。", "原始研究提出將檢索器與生成器整合的架構；本文只使用其基本思想，不照搬模型實驗數值。"], "supports": ["RAG基本定義", "檢索與生成結合"]}, {"id": "S02", "publisher": "Amazon Web Services", "title": "What is Retrieval-Augmented Generation (RAG)?", "url": "https://aws.amazon.com/what-is/retrieval-augmented-generation/", "type": "技術說明", "date": "持續更新", "takeaways": ["RAG 在回答前加入外部可信資料，協助模型參考組織或領域知識。", "典型用途包含以企業內部文件回答問題；並非每次都要重新訓練模型。"], "supports": ["生活比喻", "企業與校園應用"]}, {"id": "S03", "publisher": "IBM", "title": "What is Retrieval-Augmented Generation (RAG)?", "url": "https://www.ibm.com/think/topics/retrieval-augmented-generation", "type": "技術說明", "date": "持續更新", "takeaways": ["將檢索內容加入提示詞，再由 LLM 組織回答，可改善資訊相關性。", "RAG 有助於降低幻覺風險，但不能保證完全正確。"], "supports": ["RAG優點", "幻覺與限制"]}, {"id": "S04", "publisher": "Microsoft Learn", "title": "Retrieval augmented generation (RAG) and indexes in Microsoft Foundry", "url": "https://learn.microsoft.com/en-us/azure/foundry/concepts/retrieval-augmented-generation", "type": "官方技術文件", "date": "持續更新", "takeaways": ["線上 RAG 可分 Retrieve → Augment → Generate。", "索引可支援關鍵字、語意、向量與混合檢索，文件標題與 URL 有助來源追溯。", "資料切塊、Embedding、搜尋設定會影響檢索品質；需要權限與隱私控管。"], "supports": ["三步驟", "索引", "檢索策略", "錯誤定位"]}, {"id": "S05", "publisher": "Ragas", "title": "Faithfulness — Ragas Documentation", "url": "https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/", "type": "官方評估文件", "date": "持續更新", "takeaways": ["Faithfulness 衡量生成回答的主張是否受提供的檢索上下文支持。", "可將回答拆為可檢查的主張，再逐一比較證據；較高分代表與檢索上下文更一致。"], "supports": ["回答忠實度", "品質評估"]}, {"id": "S06", "publisher": "LangChain Documentation", "title": "Learn — LangChain / LangGraph", "url": "https://docs.langchain.com/oss/python/learn", "type": "官方教學入口", "date": "持續更新", "takeaways": ["官方教學包含語意搜尋、RAG Agent 與自訂 LangGraph RAG Agent。", "RAG 可採分階段檢索與生成，也能擴充為具多個節點的工作流程。"], "supports": ["RAG的建置路徑", "Agent和RAG的關係"]}]</script><script>
const pages=JSON.parse(document.getElementById('data-pages').textContent),sources=JSON.parse(document.getElementById('data-sources').textContent);
const byId=Object.fromEntries(pages.map(p=>[p.id,p])),srcId=Object.fromEntries(sources.map(s=>[s.id,s]));
const menu=document.getElementById('wiki-menu'),panel=document.getElementById('wiki-content');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function current(){let h=location.hash.replace('#','');return byId[h]?h:'intro'}
function renderMenu(){const q=document.getElementById('wiki-search').value.trim().toLocaleLowerCase();const found=pages.filter(p=>[p.title,p.topic,p.lead,p.bullets.join(' '),p.example].join(' ').toLocaleLowerCase().includes(q));menu.innerHTML=found.map(p=>`<button class="${current()===p.id?'selected':''}" data-id="${p.id}">${esc(p.title)}<small>${esc(p.topic)}</small></button>`).join('')||'<p class="muted">找不到符合的條目</p>';menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;render()})}
function render(){const p=byId[current()];let citing=p.sources.map(id=>{let s=srcId[id];return `<div class="source-row"><strong>${id}</strong><a target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">${esc(s.publisher)}｜${esc(s.title)}</a></div>`}).join('');panel.innerHTML=`<div class="eyebrow">WIKI ARTICLE · ${esc(p.topic)}</div><h1>${esc(p.title)}</h1><div class="stats-inline"><span>來源 ${p.sources.length} 份</span><span>延伸條目 ${p.related.length} 篇</span><span>可追溯</span></div><p class="lead">${esc(p.lead)}</p><h2>重點整理</h2><ul class="note-list">${p.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul><h2>💡 初學者例子</h2><div class="example-box">${esc(p.example)}</div><h2>資料來源｜Source lineage</h2><div class="source-list">${citing}</div><h2>繼續探索</h2><div class="related">${p.related.map(id=>`<button data-id="${id}">${esc(byId[id].title)}</button>`).join('')}</div><p style="margin-top:35px"><a class="btn secondary" href="slides.html">從頭看教學簡報 ↗</a></p>`;panel.querySelectorAll('.related button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;render();window.scrollTo({top:0,behavior:'smooth'})});renderMenu();}
window.addEventListener('hashchange',render);document.getElementById('wiki-search').addEventListener('input',renderMenu);render();document.getElementById('source-ledger').innerHTML=sources.map(s=>`<div><b class="accent">${s.id}</b> ｜ <a target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">${esc(s.publisher)} — ${esc(s.title)}</a><div class="muted" style="margin-left:45px;font-size:12px">${esc(s.type)} · 來源摘要見專案 sources/${s.id}.md</div></div>`).join('');
</script></body></html>
